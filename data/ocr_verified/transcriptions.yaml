# Human-verified transcriptions of images embedded in the policy PDFs.
#
# Why: four policy tables/figures exist only as scanned images. RapidOCR reads them, but with
# errors that matter for money questions ("1oo%", "l0%", missing spaces, the ₹ sign dropped).
# Each entry was produced from the OCR output and checked by hand against the PDF image.
#
# Keyed by the first 16 hex chars of the SHA-256 of the embedded image bytes. If a PDF is
# replaced and an image changes, its hash will not match: the ingest pipeline then falls back to
# raw OCR, marks the chunk `ocr_verified: false`, and logs a warning so a human re-verifies it.

